<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#991B1B" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Logo Icon Badge -->
  <g transform="translate(10, 10)">
    <rect x="0" y="0" width="60" height="60" rx="14" fill="url(#redGrad)" filter="url(#glow)"/>
    <circle cx="30" cy="30" r="24" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="3 2"/>
    
    <!-- Cloche / Chef Serving Plate Icon -->
    <path d="M18 38 C18 24 42 24 42 38 Z" fill="url(#goldGrad)"/>
    <circle cx="30" cy="22" r="3" fill="#FFF"/>
    <rect x="15" y="38" width="30" height="3" rx="1.5" fill="#FFF"/>
    <path d="M22 29 Q25 26 27 29" stroke="#FFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
    <path d="M33 29 Q35 26 38 29" stroke="#FFF" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Text: HOTEL S&B -->
  <text x="82" y="37" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="24" font-weight="900" fill="#1E293B" letter-spacing="1">HOTEL <tspan fill="#DC2626">S&amp;B</tspan></text>
  <text x="82" y="56" font-family="'Poppins', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#D97706" letter-spacing="2">AUTHENTIC FLAVOURS &amp; DINING</text>
  
  <!-- Decorative spice star -->
  <g transform="translate(275, 25)">
    <polygon points="5,0 6.5,3.5 10,5 6.5,6.5 5,10 3.5,6.5 0,5 3.5,3.5" fill="#F59E0B"/>
  </g>
</svg>
